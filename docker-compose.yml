services:
  # 1) Service init qui rend le template -> /rendered/odoo.conf
  init-config:
    image: alpine:3.20
    container_name: ${PROJECT_NAME:-odoo}-init-config
    command: >
      sh -c "apk add --no-cache gettext >/dev/null &&
      mkdir -p /rendered &&
      envsubst < /templates/odoo.conf.template > /rendered/odoo.conf &&
      echo 'odoo.conf rendered to /rendered/odoo.conf'"
    volumes:
      - ./odoo.conf.template:/templates/odoo.conf.template:ro
      - config_data:/rendered
    environment:
      PROJECT_NAME: ${PROJECT_NAME}
      ODOO_VERSION: ${ODOO_VERSION:-18}
      ODOO_HTTP_PORT: ${ODOO_HTTP_PORT:-8069}
      ODOO_LONGPOLL_PORT: ${ODOO_LONGPOLL_PORT:-8072}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:-admin}
      ODOO_DB_NAME: ${ODOO_DB_NAME:-odoo}
      ODOO_DB_FILTER: ${ODOO_DB_FILTER:-^${ODOO_DB_NAME}$}
      ODOO_INIT_MODULES: ${ODOO_INIT_MODULES:-sale,crm,contacts}
      ODOO_WITHOUT_DEMO: ${ODOO_WITHOUT_DEMO:-all}
      ODOO_ADDONS_EXTRA: ${ODOO_ADDONS_EXTRA:-/mnt/extra-addons}
      ODOO_WORKERS: ${ODOO_WORKERS:-0}
      ODOO_LIMIT_TIME_CPU: ${ODOO_LIMIT_TIME_CPU:-60}
      ODOO_LIMIT_TIME_REAL: ${ODOO_LIMIT_TIME_REAL:-120}
    restart: "no"

  # 2) Postgres
  db:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME:-odoo}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 3) Odoo
  odoo:
    image: odoo:${ODOO_VERSION:-18}
    container_name: ${PROJECT_NAME:-odoo}-app
    depends_on:
      db:
        condition: service_healthy
      init-config:
        condition: service_completed_successfully
    ports:
      - "${ODOO_HTTP_PORT:-8069}:8069"
      - "${ODOO_LONGPOLL_PORT:-8072}:8072"
    volumes:
      - odoo_data:/var/lib/odoo
      - ./addons:${ODOO_ADDONS_EXTRA:-/mnt/extra-addons}
      - config_data:/etc/odoo:ro # contient le odoo.conf rendu
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8069/web/login | grep -q '<title>Odoo'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  # 4) (Optionnel) pgAdmin — activer avec: `--profile pgadmin`
  pgadmin:
    profiles: ["pgadmin"]
    image: dpage/pgadmin4:8
    container_name: ${PROJECT_NAME:-odoo}-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  odoo_data:
  config_data:
